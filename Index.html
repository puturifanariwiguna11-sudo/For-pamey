<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Legend of Survivor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

#game {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

h1, h2 {
    text-align: center;
}

.panel {
    background: #1f2937;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 15px;
    box-shadow: 0 5px 15px #0005;
}

input {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    margin: 8px 0;
}

button {
    width: 100%;
    padding: 12px;
    margin: 5px 0;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button:active {
    transform: scale(0.97);
}

.stat {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.stat div {
    background: #374151;
    padding: 10px;
    border-radius: 8px;
}

.bar {
    height: 20px;
    background: #374151;
    border-radius: 10px;
    overflow: hidden;
    margin: 8px 0;
}

.hp {
    height: 100%;
    background: #22c55e;
}

.enemyhp {
    height: 100%;
    background: #ef4444;
}

.log {
    background: #0b1220;
    height: 180px;
    overflow-y: auto;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
}

.hidden {
    display: none;
}

.area-btn {
    background: #7c3aed;
}

.shop-btn {
    background: #059669;
}

.danger {
    background: #dc2626;
}

</style>
</head>

<body>

<div id="game">

<h1>⚔️ LEGEND OF SURVIVOR</h1>

<div id="start" class="panel">

<h2>Mulai Petualangan</h2>

<input id="name" type="text"
placeholder="Masukkan nama kamu">

<button onclick="startGame()">
🎮 MULAI GAME
</button>

</div>


<div id="gamePanel" class="hidden">

<div class="panel">

<h2>👤 <span id="playerName"></span></h2>

<div class="stat">

<div>❤️ HP:
<span id="hp"></span> /
<span id="maxHp"></span>
</div>

<div>⭐ Level:
<span id="level"></span>
</div>

<div>💰 Gold:
<span id="gold"></span>
</div>

<div>⚔️ Attack:
<span id="attackStat"></span>
</div>

<div>🛡️ Defense:
<span id="defenseStat"></span>
</div>

<div>🧪 Potion:
<span id="potion"></span>
</div>

</div>

<p>HP</p>

<div class="bar">
<div id="hpBar" class="hp"></div>
</div>

<p>
EXP:
<span id="exp"></span>
</p>

</div>


<div class="panel">

<h2>🗺️ Pilih Area</h2>

<button class="area-btn"
onclick="explore(1)">
🌲 Hutan
</button>

<button class="area-btn"
onclick="explore(2)">
🏕️ Desa Goblin
</button>

<button class="area-btn"
onclick="explore(3)">
⛰️ Gunung Orc
</button>

<button class="area-btn"
onclick="explore(4)">
🏰 Kastil Gelap
</button>

<button class="area-btn"
onclick="explore(5)">
🔥 Sarang Naga
</button>

</div>


<div id="enemyPanel" class="panel hidden">

<h2>👹 <span id="enemyName"></span></h2>

<p>
HP Musuh:
<span id="enemyHp"></span> /
<span id="enemyMaxHp"></span>
</p>

<div class="bar">
<div id="enemyBar" class="enemyhp"></div>
</div>

<p>
⚔️ Attack:
<span id="enemyAttack"></span>
</p>

<button onclick="attackEnemy()">
⚔️ SERANG
</button>

<button onclick="usePotion()">
🧪 GUNAKAN POTION
</button>

<button class="danger"
onclick="runAway()">
🏃 LARI
</button>

</div>


<div class="panel">

<h2>🏪 Toko</h2>

<button class="shop-btn"
onclick="buyPotion()">
🧪 Potion — 30 Gold
</button>

<button class="shop-btn"
onclick="buySword()">
⚔️ Pedang Besi — 150 Gold
</button>

<button class="shop-btn"
onclick="buyArmor()">
🛡️ Armor Besi — 150 Gold
</button>

</div>


<div class="panel">

<h2>📊 Status</h2>

<p>
Senjata:
<span id="weapon"></span>
</p>

<p>
Armor:
<span id="armor"></span>
</p>

<p>
Bonus Attack:
+<span id="weaponBonus"></span>
</p>

<p>
Bonus Defense:
+<span id="armorBonus"></span>
</p>

</div>


<div class="panel">

<h2>📜 Log Petualangan</h2>

<div id="log" class="log"></div>

</div>

</div>
</div>


<script>

let player = {

    name: "",

    level: 1,
    exp: 0,

    hp: 100,
    maxHp: 100,

    attack: 15,
    defense: 5,

    gold: 100,
    potion: 2,

    weapon: "Pedang Kayu",
    weaponBonus: 0,

    armor: "Baju Kain",
    armorBonus: 0

};


let enemy = null;


const enemies = {

    1: {
        name: "Slime Hijau",
        hp: 40,
        attack: 8,
        defense: 2,
        exp: 30,
        gold: 20
    },

    2: {
        name: "Goblin",
        hp: 70,
        attack: 13,
        defense: 4,
        exp: 60,
        gold: 40
    },

    3: {
        name: "Orc",
        hp: 110,
        attack: 20,
        defense: 7,
        exp: 100,
        gold: 70
    },

    4: {
        name: "Dark Knight",
        hp: 160,
        attack: 28,
        defense: 10,
        exp: 180,
        gold: 120
    },

    5: {
        name: "Ancient Dragon",
        hp: 300,
        attack: 40,
        defense: 15,
        exp: 500,
        gold: 500,
        boss: true
    }

};


function startGame() {

    let name =
        document.getElementById("name").value.trim();

    if (name === "") {

        alert("Masukkan nama terlebih dahulu!");

        return;
    }

    player.name = name;

    document
        .getElementById("start")
        .classList.add("hidden");

    document
        .getElementById("gamePanel")
        .classList.remove("hidden");

    log(
        "🎮 Selamat datang, " +
        player.name +
        "!"
    );

    log(
        "🗺️ Pilih area untuk mulai bertualang."
    );

    update();
}


function log(text) {

    let box =
        document.getElementById("log");

    box.innerHTML +=
        "<p>" + text + "</p>";

    box.scrollTop =
        box.scrollHeight;
}


function update() {

    document.getElementById("playerName")
        .textContent = player.name;

    document.getElementById("hp")
        .textContent = player.hp;

    document.getElementById("maxHp")
        .textContent = player.maxHp;

    document.getElementById("level")
        .textContent = player.level;

    document.getElementById("gold")
        .textContent = player.gold;

    document.getElementById("attackStat")
        .textContent =
        player.attack +
        player.weaponBonus;

    document.getElementById("defenseStat")
        .textContent =
        player.defense +
        player.armorBonus;

    document.getElementById("potion")
        .textContent = player.potion;

    document.getElementById("exp")
        .textContent =
        player.exp +
        "/" +
        expNeeded();

    document.getElementById("weapon")
        .textContent =
        player.weapon;

    document.getElementById("armor")
        .textContent =
        player.armor;

    document.getElementById("weaponBonus")
        .textContent =
        player.weaponBonus;

    document.getElementById("armorBonus")
        .textContent =
        player.armorBonus;

    document.getElementById("hpBar")
        .style.width =
        (player.hp / player.maxHp * 100) +
        "%";
}


function expNeeded() {

    return player.level * 100;
}


function explore(area) {

    if (enemy !== null) {

        log("⚠️ Kamu sedang bertarung!");

        return;
    }

    if (area === 5 &&
        player.level < 5) {

        log(
            "🔒 Sarang Naga membutuhkan Level 5!"
        );

        return;
    }

    let data = enemies[area];

    enemy = {

        name: data.name,

        hp: data.hp,
        maxHp: data.hp,

        attack: data.attack,
        defense: data.defense,

        exp: data.exp,
        gold: data.gold,

        boss: data.boss || false

    };

    document
        .getElementById("enemyPanel")
        .classList.remove("hidden");

    log(
        "👹 Kamu bertemu " +
        enemy.name +
        "!"
    );

    updateEnemy();
}


function updateEnemy() {

    if (!enemy) return;

    document.getElementById("enemyName")
        .textContent =
        enemy.name;

    document.getElementById("enemyHp")
        .textContent =
        enemy.hp;

    document.getElementById("enemyMaxHp")
        .textContent =
        enemy.maxHp;

    document.getElementById("enemyAttack")
        .textContent =
        enemy.attack;

    document.getElementById("enemyBar")
        .style.width =
        (enemy.hp / enemy.maxHp * 100) +
        "%";
}


function attackEnemy() {

    if (!enemy) return;

    let damage =
        player.attack +
        player.weaponBonus -
        enemy.defense;

    if (damage < 1) {

        damage = 1;
    }

    if (Math.random() < 0.20) {

        damage *= 2;

        log("💥 CRITICAL HIT!");
    }

    enemy.hp -= damage;

    log(
        "⚔️ Kamu memberikan " +
        damage +
        " damage!"
    );

    updateEnemy();

    if (enemy.hp <= 0) {

        winBattle();

        return;
    }

    enemyAttack();
}


function enemyAttack() {

    let damage =
        enemy.attack -
        (
            player.defense +
            player.armorBonus
        );

    if (damage < 1) {

        damage = 1;
    }

    player.hp -= damage;

    log(
        "👹 " +
        enemy.name +
        " menyerang dan memberikan " +
        damage +
        " damage!"
    );

    if (player.hp <= 0) {

        player.hp = 0;

        update();

        gameOver();

        return;
    }

    update();
}


function usePotion() {

    if (!enemy) return;

    if (player.potion <= 0) {

        log("❌ Potion kamu habis!");

        return;
    }

    player.potion--;

    player.hp += 40;

    if (player.hp > player.maxHp) {

        player.hp =
            player.maxHp;
    }

    log(
        "🧪 Kamu memulihkan 40 HP."
    );

    update();

    enemyAttack();
}


function runAway() {

    if (!enemy) return;

    if (enemy.boss) {

        log(
            "❌ Kamu tidak bisa lari dari Boss!"
        );

        return;
    }

    log(
        "🏃 Kamu berhasil melarikan diri!"
    );

    enemy = null;

    document
        .getElementById("enemyPanel")
        .classList.add("hidden");
}


function winBattle() {

    log(
        "🏆 Kamu mengalahkan " +
        enemy.name +
        "!"
    );

    player.exp += enemy.exp;

    player.gold += enemy.gold;

    log(
        "⭐ +" +
        enemy.exp +
        " EXP"
    );

    log(
        "💰 +" +
        enemy.gold +
        " Gold"
    );


    if (enemy.boss) {

        log(
            "🐉 KAMU MENGALAHKAN " +
            "ANCIENT DRAGON!"
        );

        log(
            "🎉 SELAMAT! " +
            "KAMU MENAMATKAN GAME!"
        );

        alert(
            "🎉 SELAMAT " +
            player.name +
            "!\n\n" +
            "Kamu telah menamatkan game!"
        );
    }


    enemy = null;

    document
        .getElementById("enemyPanel")
        .classList.add("hidden");

    checkLevelUp();

    update();
}


function checkLevelUp() {

    while (
        player.exp >= expNeeded()
    ) {

        player.exp -=
            expNeeded();

        player.level++;

        player.maxHp += 20;

        player.hp =
            player.maxHp;

        player.attack += 5;

        player.defense += 2;

        log(
            "🎉 LEVEL UP! " +
            "Sekarang Level " +
            player.level
        );

        log(
            "❤️ HP, ⚔️ Attack, dan " +
            "🛡️ Defense meningkat!"
        );
    }
}


function buyPotion() {

    if (player.gold < 30) {

        log("❌ Gold tidak cukup!");

        return;
    }

    player.gold -= 30;

    player.potion++;

    log(
        "🧪 Kamu membeli Potion."
    );

    update();
}


function buySword() {

    if (player.weaponBonus >= 10) {

        log(
            "⚠️ Kamu sudah memiliki Pedang Besi."
        );

        return;
    }

    if (player.gold < 150) {

        log("❌ Gold tidak cukup!");

        return;
    }

    player.gold -= 150;

    player.weapon =
        "Pedang Besi";

    player.weaponBonus = 10;

    log(
        "⚔️ Kamu membeli Pedang Besi!"
    );

    update();
}


function buyArmor() {

    if (player.armorBonus >= 10) {

        log(
            "⚠️ Kamu sudah memiliki Armor Besi."
        );

        return;
    }

    if (player.gold < 150) {

        log("❌ Gold tidak cukup!");

        return;
    }

    player.gold -= 150;

    player.armor =
        "Armor Besi";

    player.armorBonus = 10;

    log(
        "🛡️ Kamu membeli Armor Besi!"
    );

    update();
}


function gameOver() {

    enemy = null;

    document
        .getElementById("enemyPanel")
        .classList.add("hidden");

    alert(
        "💀 GAME OVER!\n\n" +
        "Level kamu: " +
        player.level
    );
}

</script>

</body>
  </html>
